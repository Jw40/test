name: Initialize shared clan config

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/init-shared-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Reuse existing shared store if present
        id: existing
        shell: bash
        run: |
          if [ -f storage.json ]; then
            URL="$(python - <<'PY'
import json
try:
    print(json.load(open('storage.json')).get('url',''))
except Exception:
    print('')
PY
)"
            if [ -n "$URL" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Create public shared JSON store
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "version": 3,
            "updatedAt": "2026-10-05",
            "settings": {
              "wEhb": 45,
              "wClog": 25,
              "wRaid": 30,
              "capEhb": 1000,
              "capClog": 1000,
              "capRaid": 1000,
              "tenureCap": 24,
              "tenureBonus": 25,
              "ranks": [
                ["Bronze Scim", 0],
                ["Iron Scim", 20],
                ["Steel Scim", 40],
                ["Mith Scim", 60],
                ["Addy Scim", 80],
                ["Rune Scim", 100],
                ["Dragon Scim", 115]
              ]
            }
          }
          JSON

          RESPONSE="$(curl --fail-with-body -sS -X POST 'https://api.jsonstorage.net/v1/json'             -H 'Content-Type: application/json'             --data-binary @payload.json)"

          echo "$RESPONSE"
          URL="$(python - "$RESPONSE" <<'PY'
import json, sys
data=json.loads(sys.argv[1])
print(data['uri'])
PY
)"
          python - "$URL" <<'PY'
import json, sys
with open('storage.json','w') as f:
    json.dump({"url": sys.argv[1]}, f, indent=2)
    f.write("\n")
PY

      - name: Commit storage endpoint to Pages branch
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          rm -f payload.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage.json
          git commit -m "Add shared clan settings store"
          git push origin gh-pages
